<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>El Cartero Invisible</title>
  <link rel="stylesheet" href="/frontend/css/style.css">
</head>

<body>
  <div class="container">

    <header>
      <h1 id="titolPrincipal">El Cartero Invisible</h1>
      <!-- Botó per canviar entre tema clar i fosc -->
      <button id="btnTema" type="button">🌓 Canviar tema</button>

      <!-- Missatge de benvinguda i botó per esborrar el carnet d'usuari -->
      <p id="benvinguda"></p>
      <button id="btnEsborrarCarnet" type="button">Esborrar carnet</button>
    </header>

    <main>

      <p class="info">Benvingut al teu buzón virtual</p>

      <!-- Missatge d'error accessible: només es veu amb la classe "visible" -->
      <div id="missatgeError" aria-live="polite"></div>

      <!-- Contenidor on es renderitzaran dinàmicament les cartes en format targeta -->
      <div id="contenidorCartes"></div>

      <!-- Formulari per crear cartes (Flexbox) -->
      <form id="formCarta">
        <div class="fila-camps">
          <input type="text" id="remitent" placeholder="El teu nom" required>
          <input type="text" id="destinatari" placeholder="A qui va dirigida?" required>
        </div>
        <textarea id="contingut" placeholder="Escriu la teva carta..." required></textarea>
        <div class="fila-camps">
          <input type="text" id="personatge" placeholder="A quin personatge escrius? (ex: Einstein)">
        </div>
        <button type="submit">Enviar carta</button>
      </form>

      <!-- Botons secundaris en una sola fila -->
      <div class="barra-botons">
        <button id="btnAfegir">Afegir Carta</button>
        <button id="btnSaluda">Saluda'm!</button>
        <!-- Botó per alternar la visibilitat de la taula -->
        <button id="btnToggleTaula">Mostrar taula</button>
      </div>

      <!-- Secció del registre en forma de taula -->
      <section id="seccioTaula">
        <table id="taulaCartes" style="display: none;">
          <thead>
            <tr>
              <th>ID</th>
              <th>Remitent</th>
              <th>Destinatari</th>
              <th>Contingut (resum)</th>
              <th>Accions</th>
            </tr>
          </thead>
          <tbody id="cosTaulaCartes">
            <!-- Les files es generaran dinàmicament des de JavaScript -->
          </tbody>
        </table>
      </section>

      <!-- Buzón fix a la cantonada, maquetat amb CSS Grid (grid-template-areas) -->
      <div id="buzon" role="button" tabindex="0" aria-label="Buzón">
        <span class="segell" aria-hidden="true">📮</span>
        <span class="estat">Nova carta!</span>
        <span class="sobre" aria-hidden="true">✉️</span>
        <span class="text">Buzón</span>
        <span class="obertura" aria-hidden="true"></span>
        <p id="visites">Visites: <strong id="visitesNum">0</strong></p>
      </div>

    </main>

    <footer>
      <p>&copy; 2026 El Cartero Invisible</p>
    </footer>

  </div>
  <script type="module" src="/frontend/js/script.js"></script>
</body>

</html>
