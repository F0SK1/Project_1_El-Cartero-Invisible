<!DOCTYPE html>
<html lang="ca">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Cartero Invisible</title>
    <link rel="stylesheet" href="style.css">
    <!-- Afegit type="module" per permetre 'export' en el script.js -->
    <script type="module" src="script.js"></script>
  </head>

  <body>
    <div class="container">

      <header>
        <h1 id="titolPrincipal">El Cartero Invisible</h1>
      </header>

      <main>

        <p class="info">Benvingut al teu buzón virtual</p>

        <!-- Contenidor on es renderitzaran dinàmicament les cartes -->
        <div id="contenidorCartes"></div>

        <section id="llistatCartes">
          <!-- de moment buit: aquí aniran les cartes -->
        </section>

        <section id="formulariCarta">
          <!-- de moment buit: aquí anirà el formulari -->
        </section>

        <button id="btnAfegir">Afegir Carta</button>

        <button id="btnSaluda">Saluda'm!</button>

        <button id="buzon">📬</button>

      </main>

      <footer>
        <p>&copy; 2026 El Cartero Invisible</p>
      </footer>
      
    </div>
  </body>
</html>
